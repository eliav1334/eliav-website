                <p>🌐 דפים: ${{ steps.pages.outputs.status }}</p>
                <p>🔒 SSL: ${{ steps.ssl.outputs.status }}</p>
                <p>🔄 Redirects: ${{ steps.redirects.outputs.status }}</p>
                <p>🔗 לינקים: ${{ steps.links.outputs.status }}</p>
                <p>🔐 Security: ${{ steps.security.outputs.status }}</p>
              </div>

              <div style="background:#16213e;padding:16px;border-radius:8px;margin-bottom:16px">
                <h3 style="color:#F97316;margin-top:0">✅ משימות השבוע</h3>
                <ul>
                  <li>פרסם פוסט בדף העסקי בגוגל</li>
                  <li>בקש ביקורת מלקוח מרוצה</li>
