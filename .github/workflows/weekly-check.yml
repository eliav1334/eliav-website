name: "📊 דוח שבועי מורחב - eliavafar.co.il"

on:
  schedule:
    # כל יום ראשון ב-08:00 שעון ישראל (06:00 UTC)
    - cron: '0 6 * * 0'
  workflow_dispatch: # אפשרות להרצה ידנית מ-GitHub

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: "🔍 בדיקת כל דפי האתר (28 דפים)"
        id: pages
        run: |
          SITE="https://eliavafar.co.il"

          # דפים ראשיים (12)
          MAIN_PAGES=("/" "/bentonite-drilling" "/earthworks" "/drainage-pits" "/equipment-rental" "/contact" "/thanks" "/blog" "/accessibility-statement" "/about" "/projects" "/card")
          MAIN_NAMES=("דף ראשי" "קידוחי בנטונייט" "עבודות עפר" "בורות חלחול" "השכרת ציוד" "צור קשר" "דף תודה" "בלוג" "הצהרת נגישות" "אודות" "פרויקטים" "כרטיס ביקור")

          # מאמרי בלוג (16)
          BLOG_PAGES=("/blog/bentonite-guide" "/blog/drainage-pits-guide" "/blog/drilling-netanya" "/blog/earthworks-tips" "/blog/choose-drilling-contractor" "/blog/bentonite-vs-polymer" "/blog/drilling-hod-hasharon" "/blog/equipment-rental-guide" "/blog/contractor-license-guide" "/blog/site-development-guide" "/blog/drainage-pits-pricing" "/blog/waste-removal-guide" "/blog/foundation-piles-guide" "/blog/bentonite-drilling-cost" "/blog/earthworks-cost" "/blog/equipment-rental-cost")
          BLOG_NAMES=("מדריך בנטונייט" "מדריך בורות חלחול" "קידוח נתניה" "טיפים עבודות עפר" "בחירת קבלן קידוח" "בנטונייט vs פולימר" "קידוח הוד השרון" "מדריך השכרת ציוד" "מדריך רישיון קבלן" "מדריך פיתוח שטח" "תמחור בורות חלחול" "מדריך פינוי פסולת" "מדריך כלונסאות" "עלות קידוח בנטונייט" "עלות עבודות עפר" "עלות השכרת ציוד")

          MAIN_RESULTS=""
          BLOG_RESULTS=""
          FAIL_COUNT=0
          TOTAL=0

          # בדיקת דפים ראשיים
          for i in "${!MAIN_PAGES[@]}"; do
            URL="${SITE}${MAIN_PAGES[$i]}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null)
            TOTAL=$((TOTAL + 1))

            if [ "$STATUS" = "200" ]; then
              MAIN_RESULTS="${MAIN_RESULTS}| ${MAIN_NAMES[$i]} | ${MAIN_PAGES[$i]} | ✅ ${STATUS} |\n"
            else
              MAIN_RESULTS="${MAIN_RESULTS}| ${MAIN_NAMES[$i]} | ${MAIN_PAGES[$i]} | ❌ ${STATUS} |\n"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          # בדיקת מאמרי בלוג
          for i in "${!BLOG_PAGES[@]}"; do
            URL="${SITE}${BLOG_PAGES[$i]}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null)
            TOTAL=$((TOTAL + 1))

            if [ "$STATUS" = "200" ]; then
              BLOG_RESULTS="${BLOG_RESULTS}| ${BLOG_NAMES[$i]} | ${BLOG_PAGES[$i]} | ✅ ${STATUS} |\n"
            else
              BLOG_RESULTS="${BLOG_RESULTS}| ${BLOG_NAMES[$i]} | ${BLOG_PAGES[$i]} | ❌ ${STATUS} |\n"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          echo "main_results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$MAIN_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "blog_results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BLOG_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          PASS_COUNT=$((TOTAL - FAIL_COUNT))
          if [ "$FAIL_COUNT" -eq 0 ]; then
            echo "status=✅ כל ${TOTAL} הדפים תקינים (${TOTAL})" >> $GITHUB_OUTPUT
          else
            echo "status=❌ ${FAIL_COUNT} דפים עם בעיות מתוך ${TOTAL}!" >> $GITHUB_OUTPUT
          fi
          echo "fail_count=${FAIL_COUNT}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT

      - name: "🔄 בדיקת Redirects (דפים ישנים)"
        id: redirects
        run: |
          SITE="https://eliavafar.co.il"
          REDIRECT_RESULTS=""
          REDIRECT_FAILS=0

          OLD_PAGES=("/cfa-piles" "/micropiles" "/diaphragm-walls" "/admin" "/simple-upload" "/demolition")
          OLD_NAMES=("CFA Piles" "Micropiles" "Diaphragm Walls" "Admin" "Simple Upload" "Demolition")
          EXPECTED=("/bentonite-drilling" "/bentonite-drilling" "/bentonite-drilling" "/" "/" "/earthworks")

          for i in "${!OLD_PAGES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${SITE}${OLD_PAGES[$i]}" 2>/dev/null)
            if [ "$STATUS" = "301" ] || [ "$STATUS" = "308" ] || [ "$STATUS" = "200" ]; then
              REDIRECT_RESULTS="${REDIRECT_RESULTS}| ${OLD_NAMES[$i]} | ${OLD_PAGES[$i]} | ✅ Redirect פעיל |\n"
            else
              REDIRECT_RESULTS="${REDIRECT_RESULTS}| ${OLD_NAMES[$i]} | ${OLD_PAGES[$i]} | ❌ ${STATUS} (צפוי: 301) |\n"
              REDIRECT_FAILS=$((REDIRECT_FAILS + 1))
            fi
          done

          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REDIRECT_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "$REDIRECT_FAILS" -eq 0 ]; then
            echo "status=✅ כל ה-Redirects תקינים" >> $GITHUB_OUTPUT
          else
            echo "status=❌ ${REDIRECT_FAILS} redirects עם בעיות!" >> $GITHUB_OUTPUT
          fi

      - name: "🗺️ בדיקת Sitemap ו-robots.txt"
        id: infra
        run: |
          SITE="https://eliavafar.co.il"
          INFRA_STATUS=""

          SITEMAP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${SITE}/sitemap.xml" 2>/dev/null)
          if [ "$SITEMAP_CODE" = "200" ]; then
            SITEMAP_URLS=$(curl -s --max-time 10 "${SITE}/sitemap.xml" 2>/dev/null | grep -c "<loc>" || echo "0")
            INFRA_STATUS="${INFRA_STATUS}| sitemap.xml | ✅ תקין (${SITEMAP_URLS} URLs) |\n"
          else
            INFRA_STATUS="${INFRA_STATUS}| sitemap.xml | ❌ HTTP ${SITEMAP_CODE} |\n"
          fi

          ROBOTS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${SITE}/robots.txt" 2>/dev/null)
          if [ "$ROBOTS_CODE" = "200" ]; then
            INFRA_STATUS="${INFRA_STATUS}| robots.txt | ✅ תקין |\n"
          else
            INFRA_STATUS="${INFRA_STATUS}| robots.txt | ❌ HTTP ${ROBOTS_CODE} |\n"
          fi

          LLMS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${SITE}/llms.txt" 2>/dev/null)
          if [ "$LLMS_CODE" = "200" ]; then
            INFRA_STATUS="${INFRA_STATUS}| llms.txt | ✅ תקין |\n"
          else
            INFRA_STATUS="${INFRA_STATUS}| llms.txt | ❌ HTTP ${LLMS_CODE} |\n"
          fi

          MANIFEST_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${SITE}/manifest.json" 2>/dev/null)
          if [ "$MANIFEST_CODE" = "200" ]; then
            INFRA_STATUS="${INFRA_STATUS}| manifest.json | ✅ תקין |\n"
          else
            INFRA_STATUS="${INFRA_STATUS}| manifest.json | ❌ HTTP ${MANIFEST_CODE} |\n"
          fi

          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$INFRA_STATUS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "🔒 בדיקת SSL"
        id: ssl
        run: |
          EXPIRY=$(echo | openssl s_client -servername eliavafar.co.il -connect eliavafar.co.il:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)

          if [ -n "$EXPIRY" ]; then
            EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null)
            NOW_EPOCH=$(date +%s)
            DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))

            if [ "$DAYS_LEFT" -gt 30 ]; then
              echo "status=✅ SSL תקף - נותרו ${DAYS_LEFT} ימים (עד ${EXPIRY})" >> $GITHUB_OUTPUT
              echo "urgent=false" >> $GITHUB_OUTPUT
            elif [ "$DAYS_LEFT" -gt 7 ]; then
              echo "status=⚠️ SSL פג בקרוב! נותרו ${DAYS_LEFT} ימים בלבד!" >> $GITHUB_OUTPUT
              echo "urgent=true" >> $GITHUB_OUTPUT
            else
              echo "status=❌ SSL פג תוקף בעוד ${DAYS_LEFT} ימים!" >> $GITHUB_OUTPUT
              echo "urgent=true" >> $GITHUB_OUTPUT
            fi
            echo "days=${DAYS_LEFT}" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ לא ניתן לבדוק SSL" >> $GITHUB_OUTPUT
            echo "urgent=false" >> $GITHUB_OUTPUT
            echo "days=N/A" >> $GITHUB_OUTPUT
          fi

      - name: "⚡ בדיקת מהירות (PageSpeed + TTFB)"
        id: speed
        env:
          PSI_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          API="https://www.googleapis.com/pagespeedonline/v5/runPagespeed"
          KEY_PARAM=""
          if [ -n "$PSI_KEY" ]; then KEY_PARAM="&key=${PSI_KEY}"; fi
          URL="https://eliavafar.co.il"

          fetch_pagespeed() {
            local strategy=$1
            local target_url=$2
            local result=""
            for attempt in 1 2 3; do
              result=$(curl -s -w "\n%{http_code}" --max-time 120 "${API}?url=${target_url}&category=performance&category=accessibility&category=seo&category=best-practices&strategy=${strategy}${KEY_PARAM}")
              local http_code=$(echo "$result" | tail -1)
              local body=$(echo "$result" | sed '$d')
              if [ "$http_code" = "200" ]; then
                echo "$body"
                return 0
              fi
              echo "Attempt ${attempt} failed (HTTP ${http_code}), waiting 30s..." >&2
              sleep 30
            done
            echo "{}"
            return 0
          }

          score_icon() {
            local score=$1
            if [ "$score" = "N/A" ]; then echo "⚪"; return; fi
            if [ "$score" -ge 90 ]; then echo "🟢"; return; fi
            if [ "$score" -ge 50 ]; then echo "🟡"; return; fi
            echo "🔴"
          }

          to_percent() {
            local val=$1
            if [ -n "$val" ] && [ "$val" != "null" ] && [ "$val" != "" ]; then
              echo "$val" | awk '{printf "%d", $1 * 100}'
            else
              echo "N/A"
            fi
          }

          echo "--- PageSpeed: Mobile ---"
          MOBILE=$(fetch_pagespeed "mobile" "$URL")

          MOBILE_PERF=$(to_percent "$(echo "$MOBILE" | jq -r '.lighthouseResult.categories.performance.score // empty' 2>/dev/null)")
          MOBILE_A11Y=$(to_percent "$(echo "$MOBILE" | jq -r '.lighthouseResult.categories.accessibility.score // empty' 2>/dev/null)")
          MOBILE_SEO=$(to_percent "$(echo "$MOBILE" | jq -r '.lighthouseResult.categories.seo.score // empty' 2>/dev/null)")
          MOBILE_BP=$(to_percent "$(echo "$MOBILE" | jq -r '.lighthouseResult.categories["best-practices"].score // empty' 2>/dev/null)")

          MOBILE_LCP=$(echo "$MOBILE" | jq -r '.lighthouseResult.audits["largest-contentful-paint"].displayValue // "N/A"' 2>/dev/null)
          MOBILE_FCP=$(echo "$MOBILE" | jq -r '.lighthouseResult.audits["first-contentful-paint"].displayValue // "N/A"' 2>/dev/null)
          MOBILE_TBT=$(echo "$MOBILE" | jq -r '.lighthouseResult.audits["total-blocking-time"].displayValue // "N/A"' 2>/dev/null)
          MOBILE_CLS=$(echo "$MOBILE" | jq -r '.lighthouseResult.audits["cumulative-layout-shift"].displayValue // "N/A"' 2>/dev/null)
          MOBILE_SI=$(echo "$MOBILE" | jq -r '.lighthouseResult.audits["speed-index"].displayValue // "N/A"' 2>/dev/null)

          echo "Mobile: Perf=${MOBILE_PERF} A11y=${MOBILE_A11Y} SEO=${MOBILE_SEO} BP=${MOBILE_BP}"

          sleep 15

          echo "--- PageSpeed: Desktop ---"
          DESKTOP=$(fetch_pagespeed "desktop" "$URL")
          DESKTOP_PERF=$(to_percent "$(echo "$DESKTOP" | jq -r '.lighthouseResult.categories.performance.score // empty' 2>/dev/null)")

          # --- TTFB לכל דפי השירות ---
          echo "--- TTFB Check ---"
          TTFB_RESULTS=""
          SERVICE_PAGES=("/" "/bentonite-drilling" "/earthworks" "/drainage-pits" "/equipment-rental" "/contact")
          SERVICE_NAMES=("דף ראשי" "קידוחי בנטונייט" "עבודות עפר" "בורות חלחול" "השכרת ציוד" "צור קשר")

          for i in "${!SERVICE_PAGES[@]}"; do
            TTFB=$(curl -s -o /dev/null -w "%{time_starttransfer}" --max-time 15 "${URL}${SERVICE_PAGES[$i]}" 2>/dev/null)
            TTFB_MS=$(echo "$TTFB" | awk '{printf "%d", $1 * 1000}')
            if [ "$TTFB_MS" -lt 800 ]; then
              ICON="🟢"
            elif [ "$TTFB_MS" -lt 1800 ]; then
              ICON="🟡"
            else
              ICON="🔴"
            fi
            TTFB_RESULTS="${TTFB_RESULTS}| ${SERVICE_NAMES[$i]} | ${ICON} ${TTFB_MS}ms |\n"
          done

          # שמירת כל התוצאות
          echo "mobile_perf=${MOBILE_PERF}" >> $GITHUB_OUTPUT
          echo "mobile_a11y=${MOBILE_A11Y}" >> $GITHUB_OUTPUT
          echo "mobile_seo=${MOBILE_SEO}" >> $GITHUB_OUTPUT
          echo "mobile_bp=${MOBILE_BP}" >> $GITHUB_OUTPUT
          echo "desktop_perf=${DESKTOP_PERF}" >> $GITHUB_OUTPUT
          echo "mobile_lcp=${MOBILE_LCP}" >> $GITHUB_OUTPUT
          echo "mobile_fcp=${MOBILE_FCP}" >> $GITHUB_OUTPUT
          echo "mobile_tbt=${MOBILE_TBT}" >> $GITHUB_OUTPUT
          echo "mobile_cls=${MOBILE_CLS}" >> $GITHUB_OUTPUT
          echo "mobile_si=${MOBILE_SI}" >> $GITHUB_OUTPUT

          echo "mobile_perf_icon=$(score_icon $MOBILE_PERF)" >> $GITHUB_OUTPUT
          echo "mobile_a11y_icon=$(score_icon $MOBILE_A11Y)" >> $GITHUB_OUTPUT
          echo "mobile_seo_icon=$(score_icon $MOBILE_SEO)" >> $GITHUB_OUTPUT
          echo "mobile_bp_icon=$(score_icon $MOBILE_BP)" >> $GITHUB_OUTPUT
          echo "desktop_perf_icon=$(score_icon $DESKTOP_PERF)" >> $GITHUB_OUTPUT

          echo "ttfb_results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TTFB_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "🏆 בדיקת מתחרים (PageSpeed)"
        id: competitors
        env:
          PSI_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          API="https://www.googleapis.com/pagespeedonline/v5/runPagespeed"
          KEY_PARAM=""
          if [ -n "$PSI_KEY" ]; then KEY_PARAM="&key=${PSI_KEY}"; fi
          COMP_RESULTS=""

          COMP_URLS=("https://cfa-drilling.co.il" "https://kodchim.co.il" "https://www.s-drilling.co.il" "https://eliavafar.co.il")
          COMP_NAMES=("דנאל קידוחים (#1)" "אלון יסודות (#2)" "סחראי קידוחים (#4)" "א.א. קידוחים (אנחנו)")

          for i in "${!COMP_URLS[@]}"; do
            echo "Checking ${COMP_NAMES[$i]}..."
            RESULT=$(curl -s --max-time 90 "${API}?url=${COMP_URLS[$i]}&category=performance&strategy=mobile${KEY_PARAM}" 2>/dev/null)
            SCORE=$(echo "$RESULT" | jq -r '.lighthouseResult.categories.performance.score // empty' 2>/dev/null)

            if [ -n "$SCORE" ] && [ "$SCORE" != "null" ]; then
              SCORE_PCT=$(echo "$SCORE" | awk '{printf "%d", $1 * 100}')
              if [ "$SCORE_PCT" -ge 90 ]; then ICON="🟢";
              elif [ "$SCORE_PCT" -ge 50 ]; then ICON="🟡";
              else ICON="🔴"; fi
              COMP_RESULTS="${COMP_RESULTS}| ${COMP_NAMES[$i]} | ${ICON} ${SCORE_PCT}/100 |\n"
            else
              COMP_RESULTS="${COMP_RESULTS}| ${COMP_NAMES[$i]} | ⚪ לא זמין |\n"
            fi

            sleep 10
          done

          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$COMP_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "🔎 בדיקת דירוג מילות מפתח"
        id: keywords
        run: |
          KW_RESULTS=""

          KEYWORDS=("קידוחי+בנטונייט" "עבודות+עפר+ופיתוח" "בורות+חלחול" "קידוח+כלונסאות" "השכרת+ציוד+כבד")
          KW_NAMES=("קידוחי בנטונייט" "עבודות עפר ופיתוח" "בורות חלחול" "קידוח כלונסאות" "השכרת ציוד כבד")

          for i in "${!KEYWORDS[@]}"; do
            # חיפוש בגוגל ובדיקה אם eliavafar מופיע ב-100 תוצאות ראשונות
            SEARCH_RESULT=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" --max-time 15 "https://www.google.com/search?q=${KEYWORDS[$i]}&num=100&hl=he&gl=il" 2>/dev/null)

            if echo "$SEARCH_RESULT" | grep -q "eliavafar"; then
              # מציאת מיקום משוער
              # סופרים כמה תוצאות מופיעות לפני eliavafar
              BEFORE=$(echo "$SEARCH_RESULT" | grep -oP 'class="[^"]*"[^>]*><a[^>]*href="/url' | head -100 | grep -c "" 2>/dev/null || echo "?")
              POSITION=$(echo "$SEARCH_RESULT" | grep -oP '<a[^>]*href="[^"]*"[^>]*>' | grep -n "eliavafar" | head -1 | cut -d: -f1)

              if [ -n "$POSITION" ] && [ "$POSITION" != "" ]; then
                if [ "$POSITION" -le 3 ]; then ICON="🥇";
                elif [ "$POSITION" -le 10 ]; then ICON="🟢";
                elif [ "$POSITION" -le 20 ]; then ICON="🟡";
                else ICON="🔴"; fi
                KW_RESULTS="${KW_RESULTS}| ${KW_NAMES[$i]} | ${ICON} ~מקום ${POSITION} |\n"
              else
                KW_RESULTS="${KW_RESULTS}| ${KW_NAMES[$i]} | 🟢 נמצא בתוצאות |\n"
              fi
            else
              KW_RESULTS="${KW_RESULTS}| ${KW_NAMES[$i]} | 🔴 לא בעמוד ראשון |\n"
            fi

            sleep 5
          done

          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$KW_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "🔗 סמכות דומיין ו-Backlinks"
        id: authority
        env:
          OPR_KEY: ${{ secrets.OPEN_PAGE_RANK_KEY }}
        run: |
          AUTHORITY_RESULTS=""
          OPR_RANK="N/A"

          # --- 1. Open Page Rank (חינמי, דורש מפתח מ-openpagerank.com) ---
          if [ -n "$OPR_KEY" ]; then
            OPR_RESULT=$(curl -s --max-time 15 "https://openpagerank.com/api/v1.0/getPageRank?domains[0]=eliavafar.co.il" -H "API-OPR: ${OPR_KEY}" 2>/dev/null)
            OPR_RANK=$(echo "$OPR_RESULT" | jq -r '.response[0].page_rank_integer // "N/A"' 2>/dev/null)
            OPR_DOMAIN_RANK=$(echo "$OPR_RESULT" | jq -r '.response[0].rank // "N/A"' 2>/dev/null)
            if [ "$OPR_RANK" != "N/A" ] && [ "$OPR_RANK" != "null" ] && [ -n "$OPR_RANK" ]; then
              if [ "$OPR_RANK" -ge 5 ]; then ICON="🟢";
              elif [ "$OPR_RANK" -ge 3 ]; then ICON="🟡";
              else ICON="🔴"; fi
              AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| Page Rank (0-10) | ${ICON} ${OPR_RANK}/10 |\n"
              AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| דירוג עולמי | 🌐 #${OPR_DOMAIN_RANK} |\n"
            else
              AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| Page Rank (OPR) | ⚪ שגיאה בשליפה |\n"
            fi
          else
            AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| Page Rank (OPR) | ⚪ הוסף OPEN_PAGE_RANK_KEY לסודות |\n"
          fi

          # --- 2. Wayback Machine (מתי האתר נסרק לאחרונה) ---
          WB_RESULT=$(curl -s --max-time 15 "https://archive.org/wayback/available?url=eliavafar.co.il" 2>/dev/null)
          WB_TIMESTAMP=$(echo "$WB_RESULT" | jq -r '.archived_snapshots.closest.timestamp // "N/A"' 2>/dev/null)
          if [ "$WB_TIMESTAMP" != "N/A" ] && [ "$WB_TIMESTAMP" != "null" ] && [ -n "$WB_TIMESTAMP" ]; then
            WB_DATE="${WB_TIMESTAMP:6:2}/${WB_TIMESTAMP:4:2}/${WB_TIMESTAMP:0:4}"
            AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| Wayback Machine | ✅ ארכיון: ${WB_DATE} |\n"
          else
            AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| Wayback Machine | ⚪ לא נמצא |\n"
          fi

          # --- 3. Schema.org Markup Check (SEO טכני) ---
          HOMEPAGE=$(curl -s --max-time 15 "https://eliavafar.co.il" 2>/dev/null)
          SCHEMA_COUNT=$(echo "$HOMEPAGE" | grep -c '"@type"' 2>/dev/null || echo "0")
          HAS_LOCAL_BIZ=$(echo "$HOMEPAGE" | grep -c '"LocalBusiness"\|"Contractor"\|"HomeAndConstructionBusiness"' 2>/dev/null || echo "0")
          if [ "$SCHEMA_COUNT" -gt 0 ]; then
            LB_STATUS=$([ "$HAS_LOCAL_BIZ" -gt 0 ] && echo "✅" || echo "❌")
            AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| Schema.org | ✅ ${SCHEMA_COUNT} רשומות | LocalBusiness: ${LB_STATUS} |\n"
          else
            AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| Schema.org | ❌ לא נמצא — פוגע ב-SEO |\n"
          fi

          # --- 4. Bing Indexed Pages (site: search) ---
          BING_RESULT=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120" --max-time 15 "https://www.bing.com/search?q=site%3Aeliavafar.co.il" 2>/dev/null)
          if echo "$BING_RESULT" | grep -qi "eliavafar"; then
            BING_COUNT=$(echo "$BING_RESULT" | grep -oP '\d[\d,]* result' | head -1 | grep -oP '[\d,]+' | tr -d ',' 2>/dev/null || echo "")
            if [ -n "$BING_COUNT" ]; then
              AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| דפים מאונדקסים (Bing) | ✅ ~${BING_COUNT} דפים |\n"
            else
              AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| דפים מאונדקסים (Bing) | ✅ נמצאו תוצאות |\n"
            fi
          else
            AUTHORITY_RESULTS="${AUTHORITY_RESULTS}| דפים מאונדקסים (Bing) | ⚠️ לא נמצאו תוצאות |\n"
          fi

          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$AUTHORITY_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "opr_rank=${OPR_RANK}" >> $GITHUB_OUTPUT

      - name: "🔗 בדיקת לינקים חיצוניים"
        id: links
        run: |
          BROKEN=""
          BROKEN_COUNT=0

          LINKS=(
            "https://wa.me/972529556123"
            "https://fonts.googleapis.com/css2?family=Heebo"
            "https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
          )
          LINK_NAMES=(
            "WhatsApp"
            "Google Fonts"
            "Swiper CDN"
          )

          for i in "${!LINKS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L "${LINKS[$i]}" 2>/dev/null)
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "301" ] && [ "$STATUS" != "302" ]; then
              BROKEN="${BROKEN}| ${LINK_NAMES[$i]} | ❌ HTTP ${STATUS} |\n"
              BROKEN_COUNT=$((BROKEN_COUNT + 1))
            fi
          done

          if [ "$BROKEN_COUNT" -eq 0 ]; then
            echo "status=✅ כל הלינקים החיצוניים תקינים" >> $GITHUB_OUTPUT
            echo "details=" >> $GITHUB_OUTPUT
          else
            echo "status=❌ נמצאו ${BROKEN_COUNT} לינקים שבורים" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo -e "$BROKEN" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: "🔐 בדיקת Security Headers"
        id: security
        run: |
          HEADERS=$(curl -sI --max-time 10 "https://eliavafar.co.il" 2>/dev/null)
          SECURITY_RESULTS=""
          SECURITY_FAILS=0

          check_header() {
            local name=$1
            local display=$2
            if echo "$HEADERS" | grep -qi "$name"; then
              SECURITY_RESULTS="${SECURITY_RESULTS}| ${display} | ✅ קיים |\n"
            else
              SECURITY_RESULTS="${SECURITY_RESULTS}| ${display} | ❌ חסר |\n"
              SECURITY_FAILS=$((SECURITY_FAILS + 1))
            fi
          }

          check_header "Strict-Transport-Security" "HSTS"
          check_header "X-Content-Type-Options" "X-Content-Type-Options"
          check_header "X-Frame-Options" "X-Frame-Options"
          check_header "Content-Security-Policy" "CSP"
          check_header "Referrer-Policy" "Referrer-Policy"
          check_header "Permissions-Policy" "Permissions-Policy"

          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$SECURITY_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "$SECURITY_FAILS" -eq 0 ]; then
            echo "status=✅ כל ה-Security Headers תקינים" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ ${SECURITY_FAILS} headers חסרים" >> $GITHUB_OUTPUT
          fi

      - name: "📋 יצירת דוח Issue"
        id: create_issue
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toLocaleDateString('he-IL', {
              year: 'numeric', month: 'long', day: 'numeric',
              timeZone: 'Asia/Jerusalem'
            });

            // סגירת issues ישנים עם label weekly-report
            const oldIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'weekly-report',
              state: 'open'
            });
            for (const issue of oldIssues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

            const pagesStatus = `${{ steps.pages.outputs.status }}`;
            const failCount = `${{ steps.pages.outputs.fail_count }}`;
            const sslStatus = `${{ steps.ssl.outputs.status }}`;

            const mPerf = `${{ steps.speed.outputs.mobile_perf }}`;
            const mA11y = `${{ steps.speed.outputs.mobile_a11y }}`;
            const mSeo = `${{ steps.speed.outputs.mobile_seo }}`;
            const mBp = `${{ steps.speed.outputs.mobile_bp }}`;
            const dPerf = `${{ steps.speed.outputs.desktop_perf }}`;
            const mPerfIcon = `${{ steps.speed.outputs.mobile_perf_icon }}`;
            const mA11yIcon = `${{ steps.speed.outputs.mobile_a11y_icon }}`;
            const mSeoIcon = `${{ steps.speed.outputs.mobile_seo_icon }}`;
            const mBpIcon = `${{ steps.speed.outputs.mobile_bp_icon }}`;
            const dPerfIcon = `${{ steps.speed.outputs.desktop_perf_icon }}`;

            const mLcp = `${{ steps.speed.outputs.mobile_lcp }}`;
            const mFcp = `${{ steps.speed.outputs.mobile_fcp }}`;
            const mTbt = `${{ steps.speed.outputs.mobile_tbt }}`;
            const mCls = `${{ steps.speed.outputs.mobile_cls }}`;
            const mSi = `${{ steps.speed.outputs.mobile_si }}`;

            const linksStatus = `${{ steps.links.outputs.status }}`;
            const linksDetails = `${{ steps.links.outputs.details }}`;
            const redirectsStatus = `${{ steps.redirects.outputs.status }}`;
            const securityStatus = `${{ steps.security.outputs.status }}`;

            const hasProblems = failCount !== '0' ||
              `${{ steps.ssl.outputs.urgent }}` === 'true' ||
              linksStatus.includes('❌');
            const urgencyTag = hasProblems ? '🚨 ' : '';

            // בסיס להשוואה (ציוני 12 באפריל 2026 — לפני התיקונים)
            const baseline = { perf: 65, a11y: 93, seo: 100, bp: 92 };
            const perfDiff = mPerf !== 'N/A' ? parseInt(mPerf) - baseline.perf : 0;
            const perfTrend = perfDiff > 0 ? `📈 +${perfDiff}` : perfDiff < 0 ? `📉 ${perfDiff}` : '➡️ ללא שינוי';

            const body = [
              '## 📊 דוח שבועי מורחב - eliavafar.co.il',
              `**תאריך:** ${today}`,
              '',
              '---',
              '',
              '### ⚡ ביצועים (Lighthouse)',
              '',
              '| קטגוריה | מובייל | דסקטופ |',
              '|----------|--------|--------|',
              `| Performance | ${mPerfIcon} **${mPerf}**/100 | ${dPerfIcon} ${dPerf}/100 |`,
              `| Accessibility | ${mA11yIcon} ${mA11y}/100 | - |`,
              `| SEO | ${mSeoIcon} ${mSeo}/100 | - |`,
              `| Best Practices | ${mBpIcon} ${mBp}/100 | - |`,
              '',
              `**מגמה (Performance):** ${perfTrend} (בסיס: ${baseline.perf} מ-12/04/2026)`,
              '',
              '**Core Web Vitals (מובייל):**',
              '| מדד | ערך | יעד |',
              '|-----|-----|-----|',
              `| FCP (First Contentful Paint) | ${mFcp} | < 1.8s |`,
              `| LCP (Largest Contentful Paint) | ${mLcp} | < 2.5s |`,
              `| TBT (Total Blocking Time) | ${mTbt} | < 200ms |`,
              `| CLS (Cumulative Layout Shift) | ${mCls} | < 0.1 |`,
              `| Speed Index | ${mSi} | < 3.4s |`,
              '',
              '---',
              '',
              '### ⏱️ זמני תגובה (TTFB)',
              '',
              '| דף | TTFB |',
              '|----|------|',
              `${{ steps.speed.outputs.ttfb_results }}`,
              '',
              '---',
              '',
              '### 🏆 השוואת מתחרים (Performance מובייל)',
              '',
              '| מתחרה | ציון |',
              '|-------|------|',
              `${{ steps.competitors.outputs.results }}`,
              '',
              '---',
              '',
              '### 🔎 דירוג מילות מפתח בגוגל',
              '',
              '| מילת מפתח | דירוג |',
              '|-----------|-------|',
              `${{ steps.keywords.outputs.results }}`,
              '',
              '---',
              '',
              '### 🔗 סמכות דומיין ו-Backlinks',
              '',
              '| מדד | ערך |',
              '|-----|-----|',
              `${{ steps.authority.outputs.results }}`,
              '',
              '---',
              '',
              '### 🌐 סטטוס דפים ראשיים',
              pagesStatus,
              '',
              '| דף | נתיב | סטטוס |',
              '|----|------|-------|',
              `${{ steps.pages.outputs.main_results }}`,
              '',
              '<details><summary>📝 סטטוס מאמרי בלוג (16)</summary>',
              '',
              '| מאמר | נתיב | סטטוס |',
              '|------|------|-------|',
              `${{ steps.pages.outputs.blog_results }}`,
              '</details>',
              '',
              '<details><summary>🔄 Redirects (דפים ישנים)</summary>',
              '',
              redirectsStatus,
              '',
              '| דף | נתיב | סטטוס |',
              '|----|------|-------|',
              `${{ steps.redirects.outputs.results }}`,
              '</details>',
              '',
              '### 🗺️ תשתית',
              '',
              '| קובץ | סטטוס |',
              '|------|-------|',
              `${{ steps.infra.outputs.results }}`,
              '',
              '### 🔒 אבטחה',
              `**SSL:** ${sslStatus}`,
              '',
              securityStatus,
              '',
              '| Header | סטטוס |',
              '|--------|-------|',
              `${{ steps.security.outputs.results }}`,
              '',
              '### 🔗 לינקים חיצוניים',
              linksStatus,
              linksDetails ? '| שירות | סטטוס |\n|-------|-------|\n' + linksDetails : '',
              '',
              '---',
              '',
              '### 📋 משימות שבועיות:',
              '',
              '- [ ] פרסם פוסט בדף העסקי בגוגל (תמונה + 2 שורות)',
              '- [ ] בקש ביקורת מלקוח מרוצה',
              '- [ ] בדוק Search Console — מילות חיפוש חדשות',
              '- [ ] בדוק Clarity — מפות חום והקלטות',
              '',
              '---',
              '*דוח אוטומטי מורחב — GitHub Actions | eliavafar.co.il*'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${urgencyTag}📊 דוח שבועי - ${today}`,
              body: body,
              labels: ['weekly-report']
            });

            core.setOutput('issue_url', issue.data.html_url);
            core.setOutput('has_problems', hasProblems.toString());

