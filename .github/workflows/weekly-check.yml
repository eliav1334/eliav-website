          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: eliav1334@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "${{ steps.pages.outputs.fail_count != '0' && '🚨' || '📊' }} דוח שבועי מורחב - eliavafar.co.il"
          to: eliav1334@gmail.com
          from: "בדיקת אתר <eliav1334@gmail.com>"
          html_body: |
            <div dir="rtl" style="font-family:Arial,sans-serif;max-width:700px;margin:0 auto;background:#1a1a2e;color:#eee;padding:24px;border-radius:12px">
              <h2 style="color:#F97316;margin-top:0">📊 דוח שבועי מורחב — eliavafar.co.il</h2>

              <div style="background:#16213e;padding:16px;border-radius:8px;margin-bottom:16px">
                <h3 style="color:#F97316;margin-top:0">⚡ ביצועים (Lighthouse מובייל)</h3>
                <table style="width:100%;border-collapse:collapse;color:#eee">
                  <tr style="border-bottom:1px solid #333">
                    <td style="padding:8px"><strong>Performance</strong></td>
                    <td style="padding:8px;text-align:center;font-size:1.2em"><strong>${{ steps.speed.outputs.mobile_perf }}/100</strong></td>
