<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B2A3F; --navy2:#103A56; --blue:#0073a8; --orange:#F97316; --orange2:#C05621; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Heebo',sans-serif}
  body{background:#eef1f5;padding:40px;color:#0B2A3F}
  h1{font-family:'Rubik';font-size:26px;margin-bottom:6px}
  .sub{color:#64748B;margin-bottom:32px;font-size:15px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
  .card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(11,42,63,.08);text-align:center}
  .label{font-family:'Rubik';font-weight:700;color:#0073a8;margin-bottom:18px;font-size:15px}
  .swatches{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
  .sw{border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:center}
  .light{background:#fff;border:1px solid #e2e8f0}
  .dark{background:linear-gradient(135deg,#103A56,#0B2A3F)}
  .row{margin-top:22px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
  svg{display:block}
</style>
</head>
<body>
  <h1>לוגו — א.א קידוחים ופיתוח · 3 קונספטים</h1>
  <div class="sub">כל קונספט: גרסה מרובעת (לפרופיל/Ads) על רקע בהיר וכהה. בחר מספר ואני מפיק קבצים (SVG + PNG שקוף).</div>

  <div class="grid">

    <!-- ===== Concept 1: Auger / drill in a ring ===== -->
    <div class="card">
      <div class="label">קונספט 1 — מקדח בטבעת</div>
      <div class="swatches">
        <div class="sw light">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="70" fill="#0B2A3F"/>
            <circle cx="75" cy="75" r="70" fill="none" stroke="#F97316" stroke-width="4"/>
            <!-- auger -->
            <g stroke="#F97316" stroke-width="7" stroke-linecap="round" fill="none">
              <path d="M75 30 L75 92"/>
              <path d="M58 44 q17 8 34 0"/>
              <path d="M58 58 q17 8 34 0"/>
              <path d="M58 72 q17 8 34 0"/>
            </g>
            <path d="M62 92 L88 92 L75 112 Z" fill="#F97316"/>
            <text x="75" y="134" text-anchor="middle" fill="#fff" font-family="Rubik" font-weight="800" font-size="15">א.א</text>
          </svg>
        </div>
        <div class="sw dark">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="70" fill="#fff"/>
            <circle cx="75" cy="75" r="70" fill="none" stroke="#F97316" stroke-width="4"/>
            <g stroke="#0B2A3F" stroke-width="7" stroke-linecap="round" fill="none">
              <path d="M75 30 L75 92"/>
              <path d="M58 44 q17 8 34 0"/><path d="M58 58 q17 8 34 0"/><path d="M58 72 q17 8 34 0"/>
            </g>
            <path d="M62 92 L88 92 L75 112 Z" fill="#F97316"/>
            <text x="75" y="134" text-anchor="middle" fill="#0B2A3F" font-family="Rubik" font-weight="800" font-size="15">א.א</text>
          </svg>
        </div>
      </div>
      <div class="row">
        <svg width="230" height="64" viewBox="0 0 230 64">
          <circle cx="32" cy="32" r="30" fill="#0B2A3F"/>
          <g stroke="#F97316" stroke-width="3.4" stroke-linecap="round" fill="none">
            <path d="M32 13 L32 40"/><path d="M24 20 q8 4 16 0"/><path d="M24 27 q8 4 16 0"/><path d="M24 34 q8 4 16 0"/>
          </g>
          <path d="M26 40 L38 40 L32 50 Z" fill="#F97316"/>
          <text x="72" y="30" font-family="Rubik" font-weight="900" font-size="20" fill="#0B2A3F">א.א קידוחים ופיתוח</text>
          <text x="72" y="48" font-family="Heebo" font-weight="600" font-size="11.5" fill="#0073a8" letter-spacing="1">קידוחים · עבודות עפר · פיתוח</text>
        </svg>
      </div>
    </div>

    <!-- ===== Concept 2: Hexagon monogram ===== -->
    <div class="card">
      <div class="label">קונספט 2 — מונוגרמה משושה</div>
      <div class="swatches">
        <div class="sw light">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <polygon points="75,12 128,42 128,108 75,138 22,108 22,42" fill="#F97316"/>
            <polygon points="75,24 117,48 117,102 75,126 33,102 33,48" fill="#0B2A3F"/>
            <text x="75" y="86" text-anchor="middle" fill="#fff" font-family="Rubik" font-weight="900" font-size="46">אא</text>
            <rect x="48" y="98" width="54" height="5" rx="2.5" fill="#F97316"/>
          </svg>
        </div>
        <div class="sw dark">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <polygon points="75,12 128,42 128,108 75,138 22,108 22,42" fill="#F97316"/>
            <polygon points="75,24 117,48 117,102 75,126 33,102 33,48" fill="#fff"/>
            <text x="75" y="86" text-anchor="middle" fill="#0B2A3F" font-family="Rubik" font-weight="900" font-size="46">אא</text>
            <rect x="48" y="98" width="54" height="5" rx="2.5" fill="#F97316"/>
          </svg>
        </div>
      </div>
      <div class="row">
        <svg width="230" height="64" viewBox="0 0 230 64">
          <polygon points="32,6 56,20 56,44 32,58 8,44 8,20" fill="#F97316"/>
          <polygon points="32,12 50,23 50,41 32,52 14,41 14,23" fill="#0B2A3F"/>
          <text x="32" y="39" text-anchor="middle" fill="#fff" font-family="Rubik" font-weight="900" font-size="20">אא</text>
          <text x="72" y="30" font-family="Rubik" font-weight="900" font-size="20" fill="#0B2A3F">א.א קידוחים ופיתוח</text>
          <text x="72" y="48" font-family="Heebo" font-weight="600" font-size="11.5" fill="#0073a8" letter-spacing="1">קידוחים · עבודות עפר · פיתוח</text>
        </svg>
      </div>
    </div>

    <!-- ===== Concept 3: Borehole rings ===== -->
    <div class="card">
      <div class="label">קונספט 3 — חתך קידוח</div>
      <div class="swatches">
        <div class="sw light">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <rect x="5" y="5" width="140" height="140" rx="28" fill="#0B2A3F"/>
            <circle cx="75" cy="68" r="46" fill="none" stroke="#0073a8" stroke-width="6"/>
            <circle cx="75" cy="68" r="32" fill="none" stroke="#F97316" stroke-width="6"/>
            <circle cx="75" cy="68" r="15" fill="#F97316"/>
            <text x="75" y="74" text-anchor="middle" fill="#0B2A3F" font-family="Rubik" font-weight="900" font-size="15">אא</text>
            <text x="75" y="130" text-anchor="middle" fill="#fff" font-family="Heebo" font-weight="700" font-size="13" letter-spacing="1">קידוחים ופיתוח</text>
          </svg>
        </div>
        <div class="sw dark">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <rect x="5" y="5" width="140" height="140" rx="28" fill="#fff"/>
            <circle cx="75" cy="68" r="46" fill="none" stroke="#0073a8" stroke-width="6"/>
            <circle cx="75" cy="68" r="32" fill="none" stroke="#F97316" stroke-width="6"/>
            <circle cx="75" cy="68" r="15" fill="#F97316"/>
            <text x="75" y="74" text-anchor="middle" fill="#fff" font-family="Rubik" font-weight="900" font-size="15">אא</text>
            <text x="75" y="130" text-anchor="middle" fill="#0B2A3F" font-family="Heebo" font-weight="700" font-size="13" letter-spacing="1">קידוחים ופיתוח</text>
          </svg>
        </div>
      </div>
      <div class="row">
        <svg width="230" height="64" viewBox="0 0 230 64">
          <circle cx="32" cy="32" r="27" fill="none" stroke="#0073a8" stroke-width="4"/>
          <circle cx="32" cy="32" r="18" fill="none" stroke="#F97316" stroke-width="4"/>
          <circle cx="32" cy="32" r="8" fill="#F97316"/>
          <text x="72" y="30" font-family="Rubik" font-weight="900" font-size="20" fill="#0B2A3F">א.א קידוחים ופיתוח</text>
          <text x="72" y="48" font-family="Heebo" font-weight="600" font-size="11.5" fill="#0073a8" letter-spacing="1">קידוחים · עבודות עפר · פיתוח</text>
        </svg>
      </div>
    </div>

  </div>
</body>
</html>
