<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>לוגו — אפשרויות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Heebo',sans-serif}
  body{background:#eef1f5;color:#0B2A3F;padding:24px 14px 60px}
  h1{font-size:24px;font-weight:900;text-align:center}
  .sub{color:#64748B;text-align:center;margin:8px 0 26px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:880px;margin:0 auto}
  @media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:#fff;border-radius:18px;box-shadow:0 8px 22px rgba(11,42,63,.09);overflow:hidden;text-align:center;border:2px solid transparent;transition:.15s}
  .num{background:#0B2A3F;color:#fff;font-weight:900;font-size:18px;padding:8px}
  .card img{width:100%;height:auto;display:block;background:#fff}
</style>
</head>
<body>
  <h1>לוגו — א.א קידוחים ופיתוח</h1>
  <div class="sub">8 אפשרויות מקצועיות. בחר מספר — ואפיק אותו מוכן (PNG שקוף + מרובע ל-Ads/פרופיל + גרסה לאתר).</div>
  <div class="grid">
    <div class="card"><div class="num">1</div><img src="logo-options/1.png" alt="לוגו 1"></div>
    <div class="card"><div class="num">2</div><img src="logo-options/2.png" alt="לוגו 2"></div>
    <div class="card"><div class="num">3</div><img src="logo-options/3.png" alt="לוגו 3"></div>
    <div class="card"><div class="num">4</div><img src="logo-options/4.png" alt="לוגו 4"></div>
    <div class="card"><div class="num">5</div><img src="logo-options/5.png" alt="לוגו 5"></div>
    <div class="card"><div class="num">6</div><img src="logo-options/6.png" alt="לוגו 6"></div>
    <div class="card"><div class="num">7</div><img src="logo-options/7.png" alt="לוגו 7"></div>
    <div class="card"><div class="num">8</div><img src="logo-options/8.png" alt="לוגו 8"></div>
  </div>
</body>
</html>
