<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>לוגו — מונוגרמה א.א</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Heebo',sans-serif}
  body{background:#eef1f5;color:#0B2A3F;padding:24px 14px 60px}
  h1{font-size:24px;font-weight:900;text-align:center}
  .sub{color:#64748B;text-align:center;margin:8px 0 22px;font-size:15px}
  .tag{text-align:center;font-weight:800;color:#0073a8;margin:20px 0 12px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:880px;margin:0 auto}
  @media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:#fff;border-radius:18px;box-shadow:0 8px 22px rgba(11,42,63,.09);overflow:hidden;text-align:center}
  .num{background:#0B2A3F;color:#fff;font-weight:900;font-size:18px;padding:8px}
  .card img{width:100%;height:auto;display:block;background:#fff}
</style>
</head>
<body>
  <h1>לוגו — מונוגרמה א.א (יוקרתי)</h1>
  <div class="sub">8 מונוגרמות. בחר מספר — ואפיק מוכן (PNG שקוף + מרובע ל-Ads/פרופיל + גרסה לאתר). טקסט עברי משובש = אתקן.</div>

  <div class="tag">נייבי + כתום (צבעי המותג)</div>
  <div class="grid">
    <div class="card"><div class="num">1</div><img src="logo-options/m1.png" alt="1"></div>
    <div class="card"><div class="num">2</div><img src="logo-options/m2.png" alt="2"></div>
    <div class="card"><div class="num">3</div><img src="logo-options/m3.png" alt="3"></div>
    <div class="card"><div class="num">4</div><img src="logo-options/m4.png" alt="4"></div>
  </div>

  <div class="tag">נייבי + זהב (יוקרתי להשוואה)</div>
  <div class="grid">
    <div class="card"><div class="num">5</div><img src="logo-options/m5.png" alt="5"></div>
    <div class="card"><div class="num">6</div><img src="logo-options/m6.png" alt="6"></div>
    <div class="card"><div class="num">7</div><img src="logo-options/m7.png" alt="7"></div>
    <div class="card"><div class="num">8</div><img src="logo-options/m8.png" alt="8"></div>
  </div>
</body>
</html>
